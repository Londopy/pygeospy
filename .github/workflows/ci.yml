name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest
      - name: Run tests (pure-Python fallback)
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: .

  test-rust:
    name: pytest with Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        # `maturin develop` requires an activated virtualenv, which setup-python
        # does not provide. Build a real wheel and install it instead.
        run: |
          pip install maturin pytest
          maturin build --release -o dist
      - name: Show wheel contents
        # Makes packaging faults obvious at a glance. A wheel that ships the
        # extension but no `pygeospy/` package installs fine and then fails at
        # import time, which is a confusing way to find out.
        run: python -m zipfile -l dist/*.whl
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Verify Rust core actually loaded
        # Run outside the repo: the _rustcore/ source dir would otherwise shadow
        # the compiled extension as an empty namespace package.
        run: |
          cd "${RUNNER_TEMP}"
          python -c "
          from pygeospy._utils import RUST_AVAILABLE
          print('RUST_AVAILABLE =', RUST_AVAILABLE)
          assert RUST_AVAILABLE, 'Rust core failed to load from the installed wheel'
          "
      - name: Run tests (Rust-accelerated)
        run: |
          cd "${RUNNER_TEMP}"
          python -m pytest "${GITHUB_WORKSPACE}/tests" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pygeospy/ tests/
      - name: Reject NUL bytes / invalid UTF-8 in source files
        # A stray NUL byte in _rustcore/src/sar.rs silently broke every Rust
        # build; cargo rejects the file outright. Catch it here, cheaply.
        run: python scripts/check_encoding.py

  changelog:
    name: validate changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install patchnotes
      # Emits ::error/::warning annotations pinned to the exact line, so a
      # malformed changelog shows up inline on the PR diff.
      - name: Validate CHANGELOG.md
        run: patchnotes CHANGELOG.md validate --strict
      - name: Check the changelog version matches the package version
        run: |
          python - <<'EOF'
          import json, pathlib, subprocess, sys, tomllib

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          pkg_version = pyproject["project"]["version"]

          latest = json.loads(
              subprocess.run(
                  ["patchnotes", "CHANGELOG.md", "--format", "json", "latest"],
                  capture_output=True, text=True, check=True,
              ).stdout
          )
          cl_version = latest["version"]

          print(f"pyproject version: {pkg_version}")
          print(f"changelog latest : {cl_version}")
          if pkg_version != cl_version:
              print(
                  f"::error file=CHANGELOG.md::pyproject version {pkg_version} has no "
                  f"matching changelog entry (latest documented release is {cl_version}). "
                  f"Add a '## [{pkg_version}] - YYYY-MM-DD' section before releasing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          EOF
