name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pytest
      - name: Run tests (pure-Python fallback)
        run: python -m pytest tests/ -v
        env:
          PYTHONPATH: .

  test-rust:
    name: pytest with Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build wheel
        # `maturin develop` requires an activated virtualenv, which setup-python
        # does not provide. Build a real wheel and install it instead.
        run: |
          pip install maturin pytest
          maturin build --release -o dist
      - name: Install wheel
        run: pip install dist/*.whl
      - name: Verify Rust core actually loaded
        # Run outside the repo: the _rustcore/ source dir would otherwise shadow
        # the compiled extension as an empty namespace package.
        run: |
          cd "${RUNNER_TEMP}"
          python -c "
          from pygeospy._utils import RUST_AVAILABLE
          print('RUST_AVAILABLE =', RUST_AVAILABLE)
          assert RUST_AVAILABLE, 'Rust core failed to load from the installed wheel'
          "
      - name: Run tests (Rust-accelerated)
        run: |
          cd "${RUNNER_TEMP}"
          python -m pytest "${GITHUB_WORKSPACE}/tests" -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check pygeospy/ tests/
      - name: Reject NUL bytes / invalid UTF-8 in source files
        # A stray NUL byte in _rustcore/src/sar.rs silently broke every Rust
        # build; cargo rejects the file outright. Catch it here, cheaply.
        run: python scripts/check_encoding.py
