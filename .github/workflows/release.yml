name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # Fail fast, before anything is built or published, if the tag and the
  # changelog disagree. Publishing is irreversible on PyPI; this is not.
  verify-changelog:
    name: verify changelog matches tag
    runs-on: ubuntu-latest
    outputs:
      notes: ${{ steps.extract.outputs.notes-file }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install patchnotes
      - run: patchnotes CHANGELOG.md validate --strict
      - name: Extract release notes for ${{ github.ref_name }}
        id: extract
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Tag version: ${VERSION}"
          if ! patchnotes CHANGELOG.md --quiet show "${VERSION}"; then
            echo "::error file=CHANGELOG.md::No changelog entry for version ${VERSION} \
          (tag ${GITHUB_REF_NAME}). Add a '## [${VERSION}] - YYYY-MM-DD' section." >&2
            exit 1
          fi
          patchnotes CHANGELOG.md show "${VERSION}" > release-notes.txt
          cat release-notes.txt
          echo "notes-file=release-notes.txt" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.txt

  build-wheels:
    name: wheels (${{ matrix.os }})
    needs: verify-changelog
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install maturin
      # -o dist pins the output dir; without it maturin writes to
      # _rustcore/target/wheels/ and the upload step finds nothing.
      - run: maturin build --release -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist/

  build-sdist:
    name: sdist
    needs: verify-changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/

  publish:
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    # Publishes via PyPI Trusted Publishing (OIDC) — no API token required.
    # Configured on PyPI under: pygeospy -> Publishing -> GitHub publisher
    # (owner: Londopy, repo: pygeospy, workflow: release.yml).
    permissions:
      id-token: write       # REQUIRED: mints the short-lived OIDC token
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts to be published
        run: ls -la dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A release uploads several wheels; if one lands and a later one
          # fails, a re-run would otherwise abort on the already-present file.
          skip-existing: true

  github-release:
    name: create GitHub Release
    needs: [verify-changelog, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Assemble release
        run: |
          mkdir -p dist
          # -o binds looser than -a, so the group parens are load-bearing here.
          find artifacts \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} dist/ \;
          ls -la dist/
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: artifacts/release-notes/release-notes.txt
          files: dist/*
          fail_on_unmatched_files: true
