[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

# ── Project metadata ──────────────────────────────────────────────────────────

[project]
name            = "pygeospy"
version         = "0.2.1"
description     = "Python GEOINT/OSINT library with Rust-accelerated core"
readme          = "README.md"
license         = { text = "MIT" }
authors         = [{ name = "pygeospy contributors" }]
requires-python = ">=3.10"

keywords = [
    "geoint", "osint", "geolocation", "solar", "shadow", "exif",
    "terrain", "dem", "sar", "search-rescue", "satellite", "ndvi",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# ── Core dependencies (always required) ──────────────────────────────────────

dependencies = [
    "httpx>=0.27",
    "typer[all]>=0.12",
    "rich>=13.0",
]

# ── Optional dependency groups ────────────────────────────────────────────────

[project.optional-dependencies]

# MOD-02: coords extras
coords = [
    "mgrs>=1.4",
    "timezonefinder>=6.0",
    "openlocationcode>=1.0.1",
]

# MOD-03: EXIF
exif = [
    "Pillow>=10.0",
    "exifread>=3.0",
    "folium>=0.17",
]

# MOD-04: terrain
terrain = [
    "rasterio>=1.3",
    "numpy>=1.24",
    "richdem>=0.3",
]

# MOD-05: OSM
osm = [
    "overpy>=0.7",
    "geopandas>=0.14",
    "shapely>=2.0",
]

# MOD-06: geocoding
geo = [
    "httpx>=0.27",
    "reverse_geocoder>=1.5",
]

# MOD-07: SAR
sar = [
    "gpxpy>=1.5",
    "shapely>=2.0",
]

# MOD-08: export
export = [
    "folium>=0.17",
    "geopandas>=0.14",
    "jinja2>=3.1",
]

# MOD-09: visual OSINT
visual = [
    "anthropic>=0.30",   # Claude backend
    "openai>=1.0",       # GPT-4V backend
]

# MOD-11: language
language = [
    "pytesseract>=0.3",
    "easyocr>=1.7",
    "Pillow>=10.0",
]

# MOD-13: satellite
satellite = [
    "rasterio>=1.3",
    "numpy>=1.24",
]

# MOD-14: acoustic
acoustic = [
    "openai-whisper>=20231117",
    "librosa>=0.10",
    "birdnetlib>=0.9",
]

# Full install — everything
all = [
    "pygeospy[coords,exif,terrain,osm,geo,sar,export,visual,language,satellite,acoustic]",
]

# ── CLI entry point ───────────────────────────────────────────────────────────

[project.scripts]
pygeospy = "pygeospy.cli:main"

# ── Maturin / Rust extension config ──────────────────────────────────────────

[tool.maturin]
python-source    = "."                      # Python package lives at ./pygeospy/
manifest-path    = "_rustcore/Cargo.toml"
module-name      = "pygeospy._rustcore"     # extension ships INSIDE the package
features         = ["pyo3/extension-module"]
# maturin writes `License-File: LICENSE` into the metadata and bundles LICENSE
# into wheels automatically, but does NOT copy it into the sdist tarball —
# PyPI then rejects the sdist with:
#   400 License-File LICENSE does not exist in distribution file
# Explicitly including it for the sdist keeps metadata and contents consistent.
include          = [{ path = "LICENSE", format = "sdist" }]
# `module-name` must be the dotted Python path of the extension. When it was a
# bare "_rustcore", maturin resolved the sibling ./_rustcore/ *crate* directory
# as the Python source root and shipped a wheel with no `pygeospy` package in it
# at all. Qualifying it as pygeospy._rustcore packages both, and stops the crate
# directory from shadowing the compiled module when running from the repo root.
# Result: pygeospy/_rustcore.abi3.so (or .pyd) after `maturin develop`.

# ── pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["tests"]
addopts      = "-v --tb=short"
filterwarnings = [
    "ignore::RuntimeWarning",
    "ignore::DeprecationWarning",
]

# ── ruff (linting) ────────────────────────────────────────────────────────────

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
# E501 long lines, E701/E702 compact one-liners: deliberate style in this codebase
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.isort]
known-first-party = ["pygeospy"]

# ── mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version     = "3.10"
ignore_missing_imports = true
warn_unused_ignores    = false
